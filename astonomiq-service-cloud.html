ACTIONS.appTech = d => { S.app={tech:d.id,job:null,tab:'jobs'}; renderPage(false); };
ACTIONS.appJob = d => { S.app.job=d.id; renderPage(false); };
ACTIONS.appBack = () => { S.app.job=null; renderPage(false); };
ACTIONS.appTab = d => { S.app.tab=d.v; renderPage(false); };
ACTIONS.appCall = d => { const t=getTicket(d.id); toast(`Calling ${esc(getCust(t.cust).contact)}. The number stays masked.`); };
ACTIONS.appNav = d => { const t=getTicket(d.id); toast(`Directions opened to ${esc(getAsset(t.asset).site)}`); };
ACTIONS.appPhoto = d => { const t=getTicket(d.id); addEvent(t,{ic:'file',what:'Photo added from site',by:'Technician app',text:'Before and after photos of the equipment.'}); refresh(); toast('Photo saved to the ticket'); };
ACTIONS.appSync = () => toast('All updates synced');

/* ===================== AMC CONTRACTS ===================== */
S.amc = {f:''};
function nextVisit(a, i){ return startOfToday() + ((i*3)%26+1)*DAY + 10*HOUR; }
registerModule('amc', {
  label:'AMC contracts', icon:'file', group:'Field and contracts',
  count: () => CONTRACTS.filter(k=>k.end<=60 && k.state!=='Active').length || '',
  render(){
    const f = S.amc.f;
    const list = CONTRACTS.filter(k=>!f || (f==='due'? (k.end<=60 && k.state!=='Active') : k.state===f)).sort((a,b)=>a.end-b.end);
    const inrTotal = CONTRACTS.filter(k=>k.cur==='INR').reduce((a,k)=>a+k.value,0);
    const due = CONTRACTS.filter(k=>k.end<=60 && k.state!=='Active');
    const vis = CONTRACTS.reduce((a,k)=>[a[0]+k.visits[0],a[1]+k.visits[1]],[0,0]);
    const pm = ASSETS.filter(a=>a.amc).map((a,i)=>({a,at:nextVisit(a,i)})).sort((x,y)=>x.at-y.at).slice(0,7);
    const tabs = [['','All',CONTRACTS.length],['due','Renewal due',due.length],['Quote sent','Quote sent',CONTRACTS.filter(k=>k.state==='Quote sent').length],['Active','Active',CONTRACTS.filter(k=>k.state==='Active').length]];
    return `
      <div class="page-head"><div><h1>AMC contracts</h1><p>Annual maintenance contracts, their planned visits and renewals. Renewal quotes include GST at 18%.</p></div><button class="btn" data-act="newAmc">${ic('plus','sm')}Propose an AMC</button></div>
      <div class="grid g-4">
        ${kpi({label:'Contract value',val:inr(inrTotal),hint:`Plus $${(CONTRACTS.filter(k=>k.cur==='USD').reduce((a,k)=>a+k.value,0)).toLocaleString('en-US')} in the Gulf`,nav:'amc'})}
        ${kpi({label:'Renewals in 60 days',val:due.length,hint:`${inr(due.filter(k=>k.cur==='INR').reduce((a,k)=>a+k.value,0))} up for renewal`,nav:'amc|f=due'})}
        ${kpi({label:'Planned visits done',val:Math.round(vis[0]/vis[1]*100)+'%',hint:`${vis[0]} of ${vis[1]} visits this contract year`,nav:'amc'})}
        ${kpi({label:'SLA met on AMC calls',val:'96%',hint:'Last 90 days',nav:'tickets|status=Closed'})}
      </div>
      <section class="panel mt-20">
        <div class="tabs" style="padding:0 14px">${tabs.map(([k,l,n])=>`<button class="tab ${f===k?'on':''}" data-act="amcTab" data-v="${k}">${l}<span class="n">${n}</span></button>`).join('')}</div>
        <div class="table-wrap"><table class="t"><thead><tr><th>Customer</th><th>Scope</th><th class="r">Value</th><th>Ends</th><th>Visits done</th><th>Status</th></tr></thead><tbody>
        ${list.map(k=>`<tr ${openAttr('contract',k.id)}><td><div class="title">${esc(getCust(k.cust).name)}</div><div class="sub">${k.id}</div></td><td><div class="small clip" style="max-width:260px">${esc(k.scope)}</div><div class="sub">SLA ${esc(k.sla)}</div></td><td class="r num">${money(k.value,k.cur)}</td><td class="small">${fDate(dayOffset(k.end))}<div class="sub ${k.end<=30?'down':''}">${k.end} days left</div></td><td style="min-width:120px"><div class="small">${k.visits[0]} of ${k.visits[1]}</div><div class="meter mt-4"><span style="width:${k.visits[0]/k.visits[1]*100}%"></span></div></td><td>${contractBadge(k)}</td></tr>`).join('')}
        </tbody></table></div></section>
      <section class="panel mt-20"><div class="panel-head"><div><h2>Upcoming preventive visits</h2><p>Planned under AMC. Book a visit to create the ticket and assign a technician.</p></div></div>
        <div class="panel-body list">${pm.map(({a,at})=>`<div class="li"><span class="grow" ${openAttr('asset',a.id)} style="cursor:pointer"><div class="t1">${esc(a.model)}</div><div class="t2">${esc(getCust(a.cust).name)}, ${esc(a.site)}</div></span><span class="small muted">${fDate(at)}</span><button class="btn sm" data-act="schedulePm" data-asset="${a.id}">Book visit</button></div>`).join('')}</div></section>`;
  },
  applyParams(p){ S.amc.f = p.f||''; }
});
ACTIONS.amcTab = d => { S.amc.f=d.v; renderPage(false); };
ACTIONS.newAmc = () => openModal({title:'Propose an AMC', sub:'Pick the customer', ok:'Next',
  body:`<div class="field"><label>Customer</label><select class="select" id="naC">${CUSTOMERS.filter(c=>!CONTRACTS.some(k=>k.cust===c.id)).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><p class="small muted">Showing customers without an AMC today.</p>`,
  onOk: m => { const cust=$('#naC',m).value; setTimeout(()=>ACTIONS.proposeAmc({cust}),10); }});

/* ===================== WARRANTY CLAIMS ===================== */
const SUPPLIERS = {Battery:'Voltacell Batteries Pvt Ltd',UPS:'PowerCore Electronics',Inverter:'PowerCore Electronics',MPPT:'Suncharge Controls',Solar:'Sunray Modules Ltd',Streetlight:'Sunray Modules Ltd'};
const CLAIMS = [
  {id:'WC-1184',tk:'TKT-2841',sku:'BAT-LFP-48',qty:16,fault:'16 packs failed on first charge cycle. Dead on arrival.',filed:minsAgo(1150),state:'Under review'},
  {id:'WC-1183',tk:'TKT-2846',sku:'BAT-VRLA-100',qty:32,fault:'Battery string failed in 14 months, within the 24 month warranty.',filed:minsAgo(200),state:'Submitted'},
  {id:'WC-1181',tk:'TKT-2843',sku:'MPT-CC-25K',qty:1,fault:'Controller output stage burnt after a surge.',filed:minsAgo(330),state:'Needs info',ask:'Please share the surge protector status and site earthing report.'},
  {id:'WC-1176',tk:'TKT-2835',sku:'BAT-LFP-48',qty:2,fault:'Lithium module BMS fault in 11 months.',filed:minsAgo(4300),state:'Approved'},
  {id:'WC-1170',tk:'TKT-2825',sku:'BAT-VRLA-100',qty:8,fault:'Cells bulged within warranty period.',filed:minsAgo(9800),state:'Credited'},
  {id:'WC-1162',tk:'TKT-2832',sku:'RECT-MOD-200',qty:1,fault:'Rectifier module failing at high load.',filed:minsAgo(15000),state:'Credited'},
];
const CL_C = {'Submitted':'b-blue','Under review':'b-navy','Needs info':'b-amber','Approved':'b-green','Credited':'b-green'};
const claimVal = c => getPart(c.sku).cost*c.qty;
const claimSup = c => SUPPLIERS[getPart(c.sku).cat] || SUPPLIERS[getAsset(getTicket(c.tk).asset).type];
const getClaim = byId(CLAIMS);
registerModule('warranty', {
  label:'Warranty claims', icon:'shield', group:'Field and contracts',
  count: () => CLAIMS.filter(c=>c.state==='Needs info'||c.state==='Submitted').length || '',
  render(){
    const open = CLAIMS.filter(c=>!['Approved','Credited'].includes(c.state));
    return `
      <div class="page-head"><div><h1>Warranty claims</h1><p>Claims on suppliers for parts that failed within warranty. Each claim is linked to the service ticket, the part and the equipment.</p></div><button class="btn" data-act="newClaim">${ic('plus','sm')}File a claim</button></div>
      <div class="grid g-4">
        ${kpi({label:'Open claims',val:open.length,hint:`${CLAIMS.filter(c=>c.state==='Needs info').length} need information from us`,nav:'warranty'})}
        ${kpi({label:'Value under claim',val:inr(open.reduce((a,c)=>a+claimVal(c),0)),hint:'Excluding GST',nav:'warranty'})}
        ${kpi({label:'Recovered this year',val:inr(CLAIMS.filter(c=>c.state==='Credited'||c.state==='Approved').reduce((a,c)=>a+claimVal(c),0)+4180000),hint:'Credit notes from suppliers',nav:'warranty'})}
        ${kpi({label:'Approval rate',val:'92%',hint:'Settled in 9 days on average',nav:'warranty'})}
      </div>
      <section class="panel mt-20"><div class="table-wrap"><table class="t"><thead><tr><th>Claim</th><th>Part</th><th>Supplier</th><th class="r">Value</th><th>Filed</th><th>Status</th></tr></thead><tbody>
        ${CLAIMS.map(c=>`<tr ${openAttr('claim',c.id)}><td><div class="title">${c.id}</div><div class="sub">${c.tk}, ${esc(getCust(getTicket(c.tk).cust).name)}</div></td><td class="small">${c.qty} × ${esc(getPart(c.sku).name)}</td><td class="small">${esc(claimSup(c))}</td><td class="r num">${inr(claimVal(c))}</td><td class="small">${fDate(c.filed)}</td><td><span class="badge ${CL_C[c.state]}">${c.state}</span></td></tr>`).join('')}
      </tbody></table></div></section>`;
  }
});
DRAWERS.claim = id => {
  const c = getClaim(id); const t=getTicket(c.tk); const a=getAsset(t.asset); const p=getPart(c.sku);
  const steps = ['Submitted','Under review','Approved','Credited']; const idx = c.state==='Needs info'?1:steps.indexOf(c.state);
  const btn = {'Submitted':`<button class="btn primary" data-act="claimMove" data-id="${c.id}" data-v="Under review">Mark as under review</button>`,
    'Under review':`<button class="btn" data-act="claimInfo" data-id="${c.id}">Supplier asked for info</button><button class="btn primary" data-act="claimMove" data-id="${c.id}" data-v="Approved">Mark approved</button>`,
    'Needs info':`<button class="btn primary" data-act="claimReply" data-id="${c.id}">Send the information</button>`,
    'Approved':`<button class="btn primary" data-act="claimMove" data-id="${c.id}" data-v="Credited">Record credit note</button>`,
    'Credited':''}[c.state];
  return {
    kicker:`${ic('shield','sm')} Warranty claim, filed ${fDate(c.filed)}`, title:`${c.id}, ${c.qty} × ${esc(p.name)}`,
    badges:`<span class="badge ${CL_C[c.state]}">${c.state}</span>`,
    body:`
      <div class="d-sec"><div class="stat-row">${steps.map((s,i)=>`<div><b style="color:${i<=idx?'var(--blue)':'var(--faint)'}">${i<idx||c.state==='Credited'?ic('checkCircle','sm'):(i===idx?ic('clock','sm'):'')}</b><span>${s}</span></div>`).join('')}</div></div>
      ${c.state==='Needs info'?`<div class="d-sec"><div class="box warn small"><b style="font-weight:500">Supplier asked:</b> ${esc(c.ask)}</div></div>`:''}
      <div class="d-sec"><h3>Details</h3><div class="facts">
        <div><div class="f-l">Ticket</div><div class="f-v"><button class="link" ${openAttr('ticket',t.id)}>${t.id}</button></div></div>
        <div><div class="f-l">Customer</div><div class="f-v"><button class="link" ${openAttr('customer',t.cust)}>${esc(getCust(t.cust).name)}</button></div></div>
        <div><div class="f-l">Part</div><div class="f-v"><button class="link" ${openAttr('part',p.sku)}>${p.sku}</button></div></div>
        <div><div class="f-l">Equipment</div><div class="f-v"><button class="link" ${openAttr('asset',a.id)}>${esc(a.model)}</button></div></div>
        <div><div class="f-l">Supplier</div><div class="f-v">${esc(claimSup(c))}</div></div>
        <div><div class="f-l">Claim value</div><div class="f-v">${inrFull(claimVal(c))} <span class="muted small">plus GST</span></div></div></div></div>
      <div class="d-sec"><h3>Fault</h3><div class="box">${esc(c.fault)}</div><div class="row wrap mt-8" style="gap:6px">${['Failure photos','Serial numbers','Technician report','Invoice copy'].map(x=>`<span class="tag">${x}</span>`).join('')}</div></div>
      ${btn?`<div class="d-actions">${btn}</div>`:''}`
  };
};
ACTIONS.claimMove = d => { const c=getClaim(d.id); c.state=d.v; addEvent(getTicket(c.tk),{ic:'shield',what:`Warranty claim ${c.id} ${d.v.toLowerCase()}`}); refresh(); toast(`${c.id} ${d.v.toLowerCase()}`); };
ACTIONS.claimInfo = d => { const c=getClaim(d.id); openModal({title:'What did the supplier ask for?', sub:c.id, ok:'Save', body:`<textarea class="textarea" id="ciT">Please share the battery room temperature log for the last 6 months.</textarea>`, onOk:m=>{ c.ask=$('#ciT',m).value; c.state='Needs info'; refresh(); toast('Claim marked as needs info'); }}); };
ACTIONS.claimReply = d => { const c=getClaim(d.id); openModal({title:'Send information to the supplier', sub:`${c.id}, ${esc(claimSup(c))}`, ok:'Send', body:`<div class="box small">${esc(c.ask)}</div><textarea class="textarea" id="crT">Attached the requested report from the technician visit. Please let us know if anything else is needed.</textarea><div class="row wrap" style="gap:6px"><span class="tag">Site report.pdf</span><span class="tag">Photos (4)</span></div>`, onOk:()=>{ c.state='Under review'; delete c.ask; refresh(); toast(`Information sent for ${c.id}`); }}); };
ACTIONS.newClaim = () => {
  const cand = TICKETS.filter(t=>{const a=getAsset(t.asset); return a.warr>0 && !CLAIMS.some(c=>c.tk===t.id);}).slice(0,15);
  openModal({title:'File a warranty claim', sub:'Tickets on equipment still under warranty', ok:'File claim', wide:true,
    body:`<div class="field"><label>Ticket</label><select class="select" id="ncT">${cand.map(t=>`<option value="${t.id}">${t.id}, ${esc(t.title)}, ${esc(getCust(t.cust).name)}</option>`).join('')}</select></div>
      <div class="grid g-2" style="gap:14px"><div class="field"><label>Failed part</label><select class="select" id="ncP">${PARTS.map(p=>`<option value="${p.sku}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Quantity</label><input class="input" type="number" id="ncQ" value="1" min="1"></div></div>
      <div class="field"><label>What failed</label><textarea class="textarea" id="ncF">Part failed within the warranty period. Technician report and photos attached.</textarea></div>`,
    onOk: m => { const id='WC-'+(Math.max(...CLAIMS.map(c=>+c.id.slice(3)))+1); CLAIMS.unshift({id,tk:$('#ncT',m).value,sku:$('#ncP',m).value,qty:Math.max(1,+$('#ncQ',m).value||1),fault:$('#ncF',m).value,filed:Date.now(),state:'Submitted'});
      refresh(); setTimeout(()=>openEntity('claim',id,true),20); toast(`${id} filed with the supplier`); }});
};

/* ===================== SPARE PARTS ===================== */
S.parts = {cat:'', low:false, q:''};
const stockState = p => p.stock < p.min ? ['Below minimum','b-red'] : (p.stock < p.min*1.3 ? ['Running low','b-amber'] : ['In stock','b-green']);
registerModule('parts', {
  label:'Spare parts', icon:'package', group:'Field and contracts',
  count: () => PARTS.filter(p=>p.stock<p.min).length || '',
  render(){
    const f=S.parts; const cats=Array.from(new Set(PARTS.map(p=>p.cat)));
    const list = PARTS.filter(p=>(!f.cat||p.cat===f.cat) && (!f.low||p.stock<p.min*1.3) && (!f.q||(p.sku+p.name).toLowerCase().includes(f.q.toLowerCase())));
    const low = PARTS.filter(p=>p.stock<p.min);
    const reserved = TICKETS.filter(t=>isOpen(t)&&t.parts.length);

function barChart(rows, opts){
  // rows: [{label, a, b}] grouped bars, a=blue, b=cyan
  const W=760, H=210, pad=28, n=rows.length, gw=(W-pad)/n, max=Math.max(1,...rows.map(r=>Math.max(r.a,r.b||0)));
  const y=v=>H-20-(v/max)*(H-36);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label)}">
    ${[0,.5,1].map(f=>`<line x1="${pad}" x2="${W}" y1="${y(max*f)}" y2="${y(max*f)}" stroke="#EEF1F6"/><text x="0" y="${y(max*f)+4}">${Math.round(max*f)}</text>`).join('')}
    ${rows.map((r,i)=>{const x=pad+i*gw; const bw=Math.min(16,gw/3);
      return `<rect x="${x+gw/2-bw-1}" y="${y(r.a)}" width="${bw}" height="${H-20-y(r.a)}" rx="3" fill="#0A6CF0"><title>${esc(r.label)}: ${r.a} ${opts.a}</title></rect>
      ${r.b!=null?`<rect x="${x+gw/2+1}" y="${y(r.b)}" width="${bw}" height="${H-20-y(r.b)}" rx="3" fill="#12B8DE"><title>${esc(r.label)}: ${r.b} ${opts.b}</title></rect>`:''}
      ${(n<=16 || i%2===0)?`<text x="${x+gw/2}" y="${H-4}" text-anchor="middle">${esc(r.label)}</text>`:''}`;}).join('')}
  </svg>`;
}

const AUD = {ac:null, iv:null};
function audioCtx(){ try{ if(!AUD.ac) AUD.ac = new (window.AudioContext||window.webkitAudioContext)(); return AUD.ac; }catch(e){ return null; } }
function tone(freq, start, len, gain){ const ac=audioCtx(); if(!ac) return; const o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=freq; g.gain.value=gain||.05; o.connect(g); g.connect(ac.destination); o.start(ac.currentTime+start); o.stop(ac.currentTime+start+len); }
function ringOn(){ ringOff(); if (SP.silent) return; const cycle=()=>{ tone(400,0,.4); tone(400,.6,.4); }; cycle(); AUD.iv=setInterval(cycle,3000); }
function ringOff(){ clearInterval(AUD.iv); AUD.iv=null; }

/* ---------- Start a call ---------- */
function newCall(o){
  if (SP.call){ toast('Finish the current call first'); return null; }
  const c = Object.assign({dir:'in', kind:'cust', cust:null, tech:null, tk:null, q:null, num:'', lang:'English', path:'UPS or inverter',
    state:'ringing', ringAt:Date.now(), t0:null, endAt:null, muted:false, hold:false, recPaused:false, kp:false, dtmf:'',
    conf:null, shown:0, note:'', summary:null, title:'', pr:null, dispo:null, updTk:null, cb:'Today, 5 pm'}, o);
  if (c.cust && !c.num) c.num = getCust(c.cust).phone;
  if (c.tech && !c.num) c.num = getTech(c.tech).phone;
  c.sc = buildScript(c); c.pr = c.sc.pr; c.mood = c.sc.mood;
  const open = c.cust ? custTickets(c.cust).filter(isOpen) : [];
  c.updTk = c.tk || (open[0] && open[0].id) || null;
  c.title = c.sc.issue;
  c.dispo = c.kind==='tech' ? 'info' : (c.path==='Ticket status'||c.dir==='out'&&c.tk ? 'upd' : (c.path==='AMC and renewal'||c.path==='Outbound customer' ? 'info' : 'new'));
  if (c.dispo==='upd' && !c.updTk) c.dispo='new';
  SP.call = c; return c;
}
function ringIncoming(q){
  const c = newCall({dir:'in', cust:q.cust, num:q.num, q, lang:q.lang, path:q.cust?q.path:'Unknown', kind:q.cust?'cust':'unknown'});
  if (!c) return;
  ringOn(); titleFlash(true);
  if (!SP.open) renderBanner(); renderSp(); renderChip();
}
function answer(){
  const c=SP.call; if(!c) return;
  ringOff(); titleFlash(false);
  c.state='live'; c.t0=Date.now(); c.shown=1;
  $('#incBanner').classList.remove('on');
  SP.open=true; renderSp(); renderChip();
}
function dialOut(o){
  const c = newCall(Object.assign({dir:'out', state:'dialing'}, o)); if(!c) return;
  SP.open=true; ringOn(); renderSp(); renderChip();
  setTimeout(()=>{ if (SP.call===c && c.state==='dialing'){ answer(); toast(`Connected to ${esc(callerName(c))}`); } }, 2800);
}
function callerName(c){ if (c.kind==='tech') return getTech(c.tech).name; if (c.cust) return getCust(c.cust).contact; return c.num||'Unknown number'; }
function callerSub(c){ if (c.kind==='tech') return `Technician, ${getTech(c.tech).region}`; if (c.cust) return getCust(c.cust).name; return 'Number not in records'; }

/* ---------- Ticker: timer, transcript, ring timeout, wrap up ---------- */
setInterval(() => {
  const c=SP.call; if(!c) return;
  if (c.state==='ringing' && Date.now()-c.ringAt > 30000){ ringOff(); titleFlash(false); const q=c.q; SP.call=null; $('#incBanner').classList.remove('on'); renderSp(); renderChip(); toast(`Missed call from ${esc(q&&q.cust?getCust(q.cust).contact:'a caller')}. It is back in the queue.`); return; }
  if (c.state==='live'){
    const t=$('#spTime'); if(t) t.textContent=mmss(secs(c));
    if (!c.hold && c.shown < c.sc.lines.length && (Date.now()-c.t0)/1000 > c.shown*2.6){
      c.shown++; if (c.shown<=3 || c.shown===c.sc.lines.length) renderSp();
      else { const tl=$('#trList'); if(tl){ const l=c.sc.lines[c.shown-1]; const ty=$('.typing',tl); const div=document.createElement('div'); const who={A:'You',C:c.cust?getCust(c.cust).contact.split(' ')[0]:'Caller',T:c.tech?getTech(c.tech).name.split(' ')[0]:'Technician'}[l[0]]; div.className='tr'+(l[0]==='A'?' agent':''); div.innerHTML=`<b>${esc(who)}</b>${esc(l[1])}`; tl.insertBefore(div, ty); tl.scrollTop=tl.scrollHeight; } }
    }
  }
  if (c.state==='wrap'){ const a=$('#spAcw'); if(a) a.textContent=mmss(Math.max(0,45-(Date.now()-c.endAt)/1000)); }

/* ---------- Map drawn on the fly ---------- */
function seeded(s){ let x=7; for (const ch of String(s)) x=(x*31+ch.charCodeAt(0))>>>0; return () => { x=(x*1664525+1013904223)>>>0; return x/4294967296; }; }
function routePts(seed, W, H){ const r=seeded(seed); const big=H>400; const sx=46+r()*40, ex=W-56-r()*36; const sy=big?H*.64+r()*30:H*(.74+r()*.1), ey=big?215+r()*40:H*(.2+r()*.12); const mx=sx+(ex-sx)*(.35+r()*.3), my=sy-(sy-ey)*(.4+r()*.25); return [[sx,sy],[sx,my],[mx,my],[mx,ey],[ex,ey]]; }
function polyLen(p){ let L=0; for(let i=1;i<p.length;i++) L+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]); return L; }
function along(p, f){ const L=polyLen(p)*Math.min(1,Math.max(0,f)); let d=0; for(let i=1;i<p.length;i++){ const s=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]); if(d+s>=L){ const k=s?(L-d)/s:0; return [p[i-1][0]+(p[i][0]-p[i-1][0])*k, p[i-1][1]+(p[i][1]-p[i-1][1])*k, i]; } d+=s; } const z=p[p.length-1]; return [z[0],z[1],p.length-1]; }
function mapSVG(t, W, H, o){
  o=o||{}; const r=seeded(t.id+'m'); const s=siteOf(t); const pts=routePts(t.id, W, H); const tech=getTech(t.tech||MA.tech);
  const vx=[pts[0][0], pts[2][0], 18+r()*30, W*.62+r()*30, W-20-r()*10], hy=[pts[0][1], pts[1][1], pts[3][1], 26+r()*20, H*.5+r()*30];
  let g=`<rect width="${W}" height="${H}" fill="#E8EDF3"/>`;
  for (let i=0;i<26;i++){ const x=r()*W, y=r()*H; g+=`<rect x="${x}" y="${y}" width="${16+r()*34}" height="${12+r()*26}" rx="3" fill="#DFE6EE"/>`; }
  if (s.coast) g+=`<path d="M0 0 H${W*.16} C${W*.12} ${H*.3} ${W*.2} ${H*.55} ${W*.1} ${H} H0Z" fill="#C7DCF1"/>`;
  g+=`<ellipse cx="${W*.78}" cy="${H*.7}" rx="${36+r()*20}" ry="${22+r()*12}" fill="#D3E8CF"/><ellipse cx="${W*.3}" cy="${H*.18}" rx="${26+r()*16}" ry="${16+r()*10}" fill="#D3E8CF"/>`;
  const road=(d,w,c)=>`<path d="${d}" stroke="#CFD7E2" stroke-width="${w+3}" fill="none" stroke-linecap="round"/><path d="${d}" stroke="${c||'#fff'}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;
  vx.forEach(x=>g+=road(`M${x} -5 V${H+5}`,6)); hy.forEach(y=>g+=road(`M-5 ${y} H${W+5}`,6));
  g+=road(`M-5 ${H*.86} C${W*.3} ${H*.7} ${W*.6} ${H*.98} ${W+5} ${H*.62}`,10,'#FBE3A6');
  const pd='M'+pts.map(p=>p.join(' ')).join(' L');
  g+=`<path d="${pd}" stroke="#fff" stroke-width="10" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="${pd}" stroke="#0A6CF0" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>`;
  const lab=(x,y,txt,a)=>`<text x="${x}" y="${y}" font-size="10.5" fill="#55657E" text-anchor="${a||'start'}" paint-order="stroke" stroke="#E8EDF3" stroke-width="3.5" font-family="inherit">${esc(txt)}</text>`;
  [[0,1],[1,2],[2,3]].forEach(([a,b],i)=>{ const P=pts[a], Q=pts[b], len=Math.hypot(Q[0]-P[0],Q[1]-P[1]); if (len < (H<200?110:56)) return; if (H<200 && i!==1) return;
    g += P[0]===Q[0] ? lab(P[0]+9, (P[1]+Q[1])/2+4, s.via[i]) : lab((P[0]+Q[0])/2, P[1]-10, s.via[i], 'middle'); });
  const e=pts[pts.length-1];
  g+=`<g transform="translate(${e[0]} ${e[1]})"><path d="M0 0 C-11 -13 -13 -18 -13 -24 a13 13 0 0 1 26 0 c0 6 -2 11 -13 24Z" fill="#D9434B" stroke="#fff" stroke-width="2"/><circle cx="0" cy="-24" r="5" fill="#fff"/></g>`;
  g+=`<text x="${e[0]}" y="${e[1]+16}" font-size="11" fill="#0F1B33" text-anchor="middle" font-weight="500" font-family="inherit">${esc(getCust(t.cust).name.split(',')[0])}</text>`;
  const d=along(pts, o.prog||0);
  g+=`<g id="${o.dotId||''}" style="transition:transform .9s linear" transform="translate(${d[0]} ${d[1]})"><circle r="15" fill="#0A6CF0" opacity=".18"><animate attributeName="r" values="9;18;9" dur="2s" repeatCount="indefinite"/></circle><circle r="8" fill="#0A6CF0" stroke="#fff" stroke-width="3"/></g>`;
  if (!o.prog) g+=`<text x="${pts[0][0]}" y="${pts[0][1]+24}" font-size="10.5" fill="#40506A" text-anchor="middle" font-family="inherit">${esc(tech.base)}</text>`;
  return `<svg class="m-map" viewBox="0 0 ${W} ${H}" ${o.style?`style="${o.style}"`:''}>${g}</svg>`;
}
function turns(t, W, H){
  const pts=routePts(t.id,W,H), s=siteOf(t), L=polyLen(pts), out=[];
  for (let i=1;i<pts.length;i++){
    const seg=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]); const km=s.km*seg/L;
    let ic='straight', txt=`Head ${pts[i][1]<pts[i-1][1]?'north':'east'} on ${s.via[Math.min(2,Math.floor((i-1)/1.4))]}`;
    if (i>1){ const a=pts[i-2], b=pts[i-1], c=pts[i]; const cr=(b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0]); ic=cr>0?'turnR':'turnL'; txt=`Turn ${cr>0?'right':'left'} onto ${s.via[Math.min(2,i-1)]}`; }
    out.push({ic, txt, km, end:polyLen(pts.slice(0,i+1))/L});
  }
  out.push({ic:'pin', txt:`Arrive at ${getCust(t.cust).name.split(',')[0]}, ${s.land.toLowerCase()}`, km:0, end:1});
  return out;
}

}

function vTravel(top){

  const cur = ts.find(x=>tr.p<x.end) || ts[ts.length-1]; const left=Math.max(0,s.km*(1-tr.p)), mins=Math.max(1,Math.ceil(etaMin(s.km)*(1-tr.p))); const arr=new Date(Date.now()+mins*MIN);
  const segLeft = Math.max(.05,(cur.end-tr.p)*s.km);

      <div class="m-row" style="margin-top:12px;gap:8px"><span class="m-chip green">${ic('chat')}Live location shared</span><span class="m-chip">${t.id}</span></div>

    </div></div>`};
}
function tickTravel(){
  const tr=MA.travel; const top=MA.stack[MA.stack.length-1]; if(!tr) return;
  if (getTicket(tr.tk).st!=='En route'){ return; }
  if (tr.p<1) tr.p=Math.min(1, tr.p+1/45);
  if (top.s!=='travel' || MA.sheet) return;
  const el=maMount(); const dot=el&&$('#maDot',el); if(!dot) return;
  const t=getTicket(tr.tk), pts=routePts(t.id,390,844), d=along(pts,tr.p); dot.setAttribute('transform',`translate(${d[0]} ${d[1]})`);
  const s=siteOf(t), mins=Math.max(1,Math.ceil(etaMin(s.km)*(1-tr.p))), arr=new Date(Date.now()+mins*MIN);
  if (tr.p>=1 && !tr.notified){ tr.notified=true; MA.banner={t:'You have arrived',b:'You are inside the check-in zone. Tap I have arrived.',ic:'pin'}; renderMA(); hideBanner(); return; }
  const ts=turns(t,390,844), cur=ts.find(x=>tr.p<x.end)||ts[ts.length-1], segLeft=Math.max(.05,(cur.end-tr.p)*s.km);
  $('#maEta',el).textContent = tr.p>=.98?'Arrived':mins+' min'; $('#maEtaSub',el).textContent= tr.p>=.98 ? 'You are at the site' : `${(s.km*(1-tr.p)).toFixed(1)} km left, arrive ${t12(arr)}`;
  $('#maTurn',el).innerHTML = `<div class="big">${ic(cur.ic)}</div><div class="g"><div class="d">${tr.p>=.98?'Arrived':segLeft<1?Math.round(segLeft*100)*10+' m':segLeft.toFixed(1)+' km'}</div><div style="font-size:14px;color:#CFDCF2">${esc(tr.p>=.98?`${getCust(t.cust).name}, ${s.land}`:cur.txt)}</div></div>`;
}

/* What the device reports for this ticket: one value off, based on the complaint */
function deviceValues(t){
  const a=getAsset(t.asset), set=rset(a), v={}, txt=(t.title+' '+t.desc).toLowerCase(), r=seeded(t.id+'rd');
  set.forEach(([k,,, lo, hi, def]) => { const j=(hi-lo)*.04*(r()-.5); v[k]=+(def+j).toFixed(def%1?1:0); });
  if (a.type==='UPS'){ if (/trip|overload|beep/.test(txt)) v.load=94; else if (/fan|temp|heat/.test(txt)) v.temp=33; else if (/battery|backup/.test(txt)){ v.batt=421; v.backup=4; } else v.temp=31; }
  else if (a.type==='Battery'){ if (/resist|ageing|backup/.test(txt)) v.ir=8.6; else v.wc=11.6; }
  else if (a.type==='Inverter'){ if (/mains|grid|switch/.test(txt)) v.grid=188; else if (/beep|overload/.test(txt)) v.load=97; else v.temp=67; }
  else if (a.type==='Solar'||a.type==='MPPT'){ if (/output|generation|ratio|drop/.test(txt)){ v.pi=6.1; v.kw=9.8; v.kwh=48; } else v.pv=468; }
  else if (a.type==='Streetlight'){ v.bv=11.2; v.led=0.4; }
  return v;
}
function aiCause(t, rd){
  const a=getAsset(t.asset), set=rset(a); const off=set.filter(([k,,,lo,hi])=>rd[k]!==undefined&&rd[k]!==''&&(+rd[k]<lo||+rd[k]>hi)).map(x=>x[0]);
  const pick = {
    UPS: off.includes('load')?['Overload on the output','Load is above 85%. Shift non critical loads and check the breaker settings.',91]:off.includes('temp')?['Cooling fan failure, high temperature','Room and cabinet are running hot. Replace the cooling fan and clean the air filters.',88]:off.includes('batt')||off.includes('backup')?['Weak battery string','DC voltage and backup are low. Check cells for a weak block before replacing the string.',86]:['Control board fault','Readings are in range. Check the event log and update the control firmware.',72],
    Battery: off.includes('ir')?['Ageing cells, high internal resistance','One block shows high resistance. Replace that block and rebalance the string.',89]:['Weak cell in the string','One cell is below 12.2 V. Replace the block and run a discharge test.',90],
    Inverter: off.includes('grid')?['Grid voltage out of range','Mains is below the cut in voltage. Change input range to wide mode and advise a stabiliser.',87]:off.includes('load')?['Overload on the output','Load is above rated capacity. Reduce load or upgrade the inverter.',90]:['Overheating, poor ventilation','Heat sink is hot. Clean the vents and move the unit away from the wall.',84],
    Solar: off.includes('pi')||off.includes('kw')?['Soiling and string mismatch','String current is low for this irradiance. Clean the modules and check the string fuses.',88]:['Grid side fault','Check the AC isolator and grid voltage at the inverter.',74],
    Streetlight: ['Battery not charging','Battery is deep discharged and LED current is low. Replace the battery and check the charge controller.',89],
  }; pick.MPPT=pick.Solar;
  const p = pick[a.type]||pick.UPS; return {cause:p[0], fix:p[1], conf:p[2], off};
}
function coverOf(t){

    return comp ? {kind:'amc', label:`Comprehensive AMC ${c.id}`, labour:true, parts:true} : {kind:'amc', label:`AMC ${c.id}, labour only`, labour:true, parts:false}; }

function bill(t){
  const w=MA.work[t.id], cv=coverOf(t), c=getCust(t.cust);

      g+=`<path d="M${x0+22} ${y} L${x0+18} ${y+42} M${x0+44} ${y} L${x0+40} ${y+42} M${x0-2} ${y+21} H${x0+64}" stroke="#DCE4EE" stroke-width=".7" opacity=".7"/>`; }
    if (dirty) g+=`<rect x="0" y="150" width="${W}" height="200" fill="#8C6B3C" opacity=".32"/>`;
  }

}
function fakeQR(seed){ const r=seeded(seed), N=29; let g=''; const fin=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#0F1B33"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#0F1B33"/>`;

function stepOk(t, w, i){
  const a=getAsset(t.asset);
  switch (WSTEPS[i][0]){
    case 'safety': return ['ppe','iso','lot','bar','inf'].every(k=>w.safety[k]);
    case 'before': return w.photos.filter(p=>p.kind==='before').length>=2;
    case 'readings': return rset(a).every(([k])=>w.rd[k]!==undefined && w.rd[k]!=='' && !isNaN(+w.rd[k]));
    case 'diagnose': return !!w.cause && w.note.trim().length>=10;
    case 'parts': return true;
    case 'test': return !!(w.test&&w.test.done) && w.photos.some(p=>p.kind==='after');
    case 'signoff': return w.cname.trim().length>1 && w.sig.length>40 && w.otpOk && w.rating>0;
    case 'close': { const b=bill(t); return b.total===0 || (w.pay && w.pay.st==='paid'); }
  }
}

  return {tabs:false, light:true, html:`<div class="m-cam-v"><div class="top"><button class="cbtn" data-act="maBack">${ic('x','sm')}</button><span style="font-size:13px">Scan part barcode</span><span style="width:40px"></span></div>

      ${r?`<div style="position:absolute;left:16px;right:16px;bottom:16px;background:#fff;color:#0F1B33;border-radius:18px;padding:14px"><div class="m-row"><div class="m-ic gr">${ic('check')}</div><div class="g"><div class="m-t1">${esc(r.name)}</div><div class="m-t3">${r.sku}${r.serial?`, SN ${r.serial}`:''}</div></div></div>${r.serial?`<div class="m-t3" style="margin-top:8px">Old part ${r.old} tagged for return, RMA tag ${r.rma}.</div>`:''}</div>`:''}</div>

function doScan(){ const top=MA.stack[MA.stack.length-1]; if (top.s!=='scan' || top.res) return; const t=getTicket(top.id), w=work(t.id), a=getAsset(t.asset);
  const pref={UPS:['UPS-FAN-120','FUS-MIDI-30'],Battery:['BAT-VRLA-100','BAT-VRLA-150'],Inverter:['FUS-MIDI-30','INV-CB-25K'],Solar:['CAB-DC-6','FUS-MIDI-30'],MPPT:['FUS-MIDI-30','MPT-CC-25K'],Streetlight:['CAB-DC-6','FUS-MIDI-30']}[a.type]||[];

  addUsed(w, x.sku, 1, serial?{serial, old:res.old, rma:res.rma}:null); top.res=res; if (typeof tone==='function'){ tone(1800,0,.06,.05); } renderMA(); }
ACTIONS.maScanAgain = () => { const top=MA.stack[MA.stack.length-1]; top.res=null; renderMA(); setTimeout(doScan, 1800); };

ACTIONS.maAskPart = () => { const id=MA.stack[MA.stack.length-1].id; openSheet('askPart',{id, sku:null, urgent:true}); };
SHEETS.askPart = o => { const inVan=new Set(vanItems().filter(x=>x.q>0).map(x=>x.sku)); const ty=getAsset(getTicket(o.id).asset).type; const want={UPS:'UPS',Battery:'Battery',Inverter:'Inverter',Solar:'Solar',MPPT:'Solar',Streetlight:'Solar'}[ty]; const list=PARTS.filter(p=>!inVan.has(p.sku)).sort((a,b)=>(b.cat===want)-(a.cat===want));
  return `<h3>Request a part</h3><div class="m-t2" style="margin-bottom:14px">The job moves to Awaiting parts. Dispatch gets the request at once.</div>
  ${list.slice(0,6).map(p=>`<button class="m-opt" data-act="maAskPick" data-v="${p.sku}" aria-pressed="${o.sku===p.sku}"><span class="rad"></span><span class="g"><div class="m-t1" style="font-size:14px">${esc(p.name)}</div><div class="m-t3">${p.stock} at ${esc(p.loc)}</div></span></button>`).join('')}
  <div class="m-li" style="border:0"><div class="g"><div class="m-t1" style="font-size:14.5px">Urgent, same day</div><div class="m-t3">Sent by courier or a runner from the depot</div></div><button class="m-switch" data-act="maAskUrg" aria-checked="${o.urgent}"></button></div>
  <button class="m-btn" data-act="maAskSend" ${o.sku?'':'disabled'}>${ic('send')}Send request</button>`; };
ACTIONS.maAskPick = d => { MA.sheet.sku=d.v; renderMA(); };
ACTIONS.maAskUrg = () => { MA.sheet.urgent=!MA.sheet.urgent; renderMA(); };
ACTIONS.maAskSend = () => { const o=MA.sheet, t=getTicket(o.id), p=getPart(o.sku); t.parts=t.parts||[]; t.parts.push({sku:o.sku,qty:1,state:'Ordered'}); t.st='Awaiting parts';
  techEvent(t,{ic:'truck',c:'amber',what:`Part requested: ${p.name}`,text:o.urgent?'Urgent, same day delivery asked.':'Normal delivery.'}, `Part request on ${t.id}: ${p.name}`);
  pushNotif(t.id,'package',`${mTech().name} requested ${p.name} for ${t.id}`);
  MA.sheet=null; while (MA.stack.length>1 && MA.stack[MA.stack.length-1].s!=='job') MA.stack.pop(); MA.anim='m-out';
  MA.banner={t:'Part requested',b:'Job paused. Your work so far is saved. Resume when the part arrives.',ic:'truck'}; renderMA(); hideBanner(4000); };

/* 6. Load test and after photos */
WBODY.test = (t,w,a) => { const T=w.test, dur0=15*60; const el=T?Math.min(dur0, Math.floor((Date.now()-T.t0)/1000*75)):0; const g=testGauges(t,w,el/dur0);
  return `<div class="m-card"><div class="m-row" style="justify-content:space-between"><div><div class="m-t1">${a.type==='Solar'||a.type==='MPPT'?'Generation check':a.type==='Battery'?'Discharge test':'Load test'}, 15 minutes</div><div class="m-t3">${T&&T.done?'Passed, all values stable':T?'Running, keep the load connected':'Run the unit on load to confirm the fix'}</div></div>${T&&T.done?`<span class="m-chip green">${ic('check')}Passed</span>`:''}</div>
    <div class="m-gauge" style="margin-top:12px" id="maGauge">${g}</div>
    <div class="m-prog" style="margin-top:12px"><i id="maTestBar" style="width:${el/dur0*100}%"></i></div><div class="m-row" style="justify-content:space-between;margin-top:6px"><span class="m-t3" id="maTestT">${pad(Math.floor(el/60))}:${pad(el%60)}</span><span class="m-t3">15:00</span></div>
    ${T?'':`<button class="m-btn navy sm" style="margin-top:12px" data-act="maTest">${ic('play')}Start test</button>`}</div>
  <div class="m-h">After photos</div><div class="m-card">${photoGrid(t,w,'after',1)}</div>`; };
function testGauges(t, w, f){ const a=getAsset(t.asset); const r=seeded(t.id+Math.floor(f*40)); const j=k=>(r()-.5)*k;
  const g = a.type==='Battery' ? [['String V',(480-f*14+j(.6)).toFixed(1)],['Current A',(42+j(1)).toFixed(1)],['Weakest V',(12.8-f*.4+j(.02)).toFixed(2)]]
    : a.type==='Solar'||a.type==='MPPT' ? [['AC kW',(19.2+j(.6)).toFixed(1)],['PV A',(11.1+j(.3)).toFixed(1)],['Grid V',(414+j(3)).toFixed(0)]]
    : a.type==='Streetlight' ? [['Battery V',(12.9+j(.05)).toFixed(2)],['LED A',(1.18+j(.02)).toFixed(2)],['Panel V',(19.3+j(.3)).toFixed(1)]]
    : [['Load %',(62+j(3)).toFixed(0)],['Output V',(230+j(1.2)).toFixed(0)],['Temp °C',(26+f*1.5+j(.3)).toFixed(1)]];
  return g.map(([l,v])=>`<div><b>${w.test?v:'--'}</b><span>${l}</span></div>`).join(''); }
ACTIONS.maTest = () => { const w=work(MA.stack[MA.stack.length-1].id); w.test={t0:Date.now(), done:false}; renderMA(); };
function tickTest(){ const top=MA.stack[MA.stack.length-1]; if(!top||top.s!=='work') return; const w=work(top.id); if(!w||!w.test||w.test.done) return;
  const el=Math.min(900, Math.floor((Date.now()-w.test.t0)/1000*75)); const m=maMount(); if(!m) return;
  if (el>=900){ w.test.done=true; techEvent(getTicket(top.id),{ic:'gauge',c:'green',what:'Load test passed, 15 minutes',text:'All values stable through the test.'}); renderMA(); return; }
  const b=$('#maTestBar',m), tt=$('#maTestT',m), g=$('#maGauge',m); if(b) b.style.width=el/9+'%'; if(tt) tt.textContent=`${pad(Math.floor(el/60))}:${pad(el%60)}`; if(g) g.innerHTML=testGauges(getTicket(top.id),w,el/900); }

/* 7. Customer sign off: signature, OTP, rating */
WBODY.signoff = (t,w,a,c) => { const star=(n)=>`<button data-act="maRate" data-v="${n}"><svg viewBox="0 0 24 24" fill="${n<=w.rating?'#F5B740':'none'}" stroke="${n<=w.rating?'#F5B740':'#C6D0DE'}" stroke-width="1.6"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg></button>`;
  const ask = ['On time','Explained the problem','Clean work','Polite'];
  return `<div class="m-card" style="background:#F5F7FB;box-shadow:none"><div class="m-row" style="gap:10px">${ic('user')}<div class="g m-t2" style="font-size:13.5px">Hand the phone to the customer for this step.</div></div></div>
  <div class="m-card"><div class="m-t3">Work done</div><div style="margin-top:4px;font-size:14px;line-height:1.5">${esc(w.note)}</div>${w.used.length?`<div class="m-t3" style="margin-top:8px">Parts: ${w.used.map(u=>`${u.q} × ${esc(vanFind(u.sku).name)}`).join(', ')}</div>`:''}</div>
  <label class="m-field"><span>Customer name</span><input class="m-input" id="maCName" value="${esc(w.cname)}"></label>
  <div class="m-field"><span style="display:flex;justify-content:space-between;font-size:13px;color:#6B7A90;margin-bottom:6px">Signature<button class="m-link" style="color:#0A6CF0;font-size:13px" data-act="maSigClear">Clear</button></span>
    <svg class="m-sig" id="maSig" viewBox="0 0 340 170"><path d="M20 140 H320" stroke="#DCE3EE" stroke-width="1"/><text x="22" y="158" font-size="10" fill="#B5C0D0" font-family="inherit">Sign above the line</text><path id="maSigP" d="${w.sig}" stroke="#0A2350" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="m-card"><div class="m-row" style="justify-content:space-between"><div><div class="m-t1" style="font-size:14.5px">Closure OTP</div><div class="m-t3">${w.otpOk?'Verified by the customer':w.otpSent?`Sent to ${esc(c.phone)} by SMS and WhatsApp`:`Sent to ${esc(c.phone)}`}</div></div>${w.otpOk?`<span class="m-chip green">${ic('check')}Verified</span>`:w.otpSent?`<button class="m-link" style="color:#0A6CF0;font-size:13.5px" data-act="maOtpSend">Resend</button>`:`<button class="m-btn sm" style="width:auto;padding:0 14px" data-act="maOtpSend">Send OTP</button>`}</div>
    ${w.otpSent&&!w.otpOk?`<div class="m-otp" style="margin-top:12px">${[0,1,2,3].map(i=>`<span class="${w.otp.length===i?'f':''}">${w.otp[i]||''}</span>`).join('')}</div><input id="maOtp" inputmode="numeric" maxlength="4" value="${esc(w.otp)}" style="position:absolute;opacity:0;pointer-events:none;width:1px;height:1px"><div class="m-pad" style="grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px">${['1','2','3','4','5','6','7','8','9','','0','del'].map(k=>k===''?'<span></span>':`<button class="m-btn white sm" data-act="maOtpKey" data-k="${k}" style="height:44px">${k==='del'?ic('chevL'):k}</button>`).join('')}</div>${w.otpErr?`<div style="color:#D9434B;font-size:12.5px;margin-top:8px">That code does not match. Ask the customer to check the latest SMS.</div>`:''}`:''}</div>
  <div class="m-card" style="text-align:center"><div class="m-t1">How was the service today?</div><div class="m-stars" style="margin:10px 0 6px">${[1,2,3,4,5].map(star).join('')}</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px">${ask.map(x=>`<button class="m-chip ${w.tags[x]?'blue':''}" style="border:0;height:30px;font:inherit;font-size:12.5px" data-act="maTag" data-v="${x}">${x}</button>`).join('')}</div></div>`; };
ACTIONS.maRate = d => { work(MA.stack[MA.stack.length-1].id).rating=+d.v; renderMA(); };
ACTIONS.maTag = d => { const w=work(MA.stack[MA.stack.length-1].id); w.tags[d.v]=!w.tags[d.v]; renderMA(); };
ACTIONS.maSigClear = () => { work(MA.stack[MA.stack.length-1].id).sig=''; renderMA(); };
ACTIONS.maOtpSend = () => { const id=MA.stack[MA.stack.length-1].id, w=work(id), c=getCust(getTicket(id).cust); const r=seeded(id+Date.now()); w.code=String(Math.floor(1000+r()*8999)); w.otpSent=true; w.otp=''; w.otpErr=false; renderMA();
  setTimeout(()=>{ MA.banner={t:`Message on ${c.contact.split(' ')[0]}'s phone`, b:`${w.code} is your AstonomiQ service closure code for ${id}. Share it only with the engineer.`, ic:'chat'}; renderMA(); hideBanner(7000); }, 1400); };
ACTIONS.maOtpKey = d => { const id=MA.stack[MA.stack.length-1].id, w=work(id); if (d.k==='del') w.otp=w.otp.slice(0,-1); else if (w.otp.length<4) w.otp+=d.k; w.otpErr=false;
  if (w.otp.length===4){ if (w.otp===w.code){ w.otpOk=true; techEvent(getTicket(id),{ic:'lock',c:'green',what:'Customer verified closure with OTP'}); } else { w.otpErr=true; w.otp=''; } } renderMA(); };
/* Signature drawing that works with mouse and touch, also when the phone frame is scaled */
MA_AFTER.push(el => { const svg=$('#maSig',el); if(!svg) return; const path=$('#maSigP',svg); const id=MA.stack[MA.stack.length-1].id; let drawing=false;
  const pt = e => { const r=svg.getBoundingClientRect(); return [((e.clientX-r.left)/r.width*340).toFixed(1), ((e.clientY-r.top)/r.height*170).toFixed(1)]; };
  svg.addEventListener('pointerdown', e => { drawing=true; svg.setPointerCapture(e.pointerId); const p=pt(e); work(id).sig += ` M${p[0]} ${p[1]}`; path.setAttribute('d', work(id).sig); e.preventDefault(); });
  svg.addEventListener('pointermove', e => { if(!drawing) return; const p=pt(e); work(id).sig += ` L${p[0]} ${p[1]}`; path.setAttribute('d', work(id).sig); });
  const end = () => { if(!drawing) return; drawing=false; const v=$('.m-view',el), y=v?v.scrollTop:0; renderMA(); const v2=$('.m-view',maMount()); if(v2) v2.scrollTop=y; };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end); });

/* 8. Service report, GST invoice and payment */
WBODY.close = (t,w,a,c) => { const b=bill(t), s=siteOf(t), sr='SR-'+t.id.slice(4)+'-'+pad(new Date().getMonth()+1); const gstin=gstinFor(c); const intra=true; const half=Math.round(b.gst/2);
  const pay = b.total===0 ? `<div class="m-card" style="background:#E3F6EC;box-shadow:none"><div class="m-row" style="gap:10px;color:#0F7A4C">${ic('checkCircle')}<div class="g" style="font-size:14px">Fully covered under ${esc(b.cv.label)}. Nothing to collect.</div></div></div>` : payBox(t,w,b,c);
  return `<div class="m-doc"><div class="m-row" style="justify-content:space-between;align-items:flex-start"><div><h4>AstonomiQ Service Report</h4><div style="color:#6B7A90">${sr}, ${fDate(Date.now())}</div></div><div style="text-align:right;color:#6B7A90">GSTIN ${AQ_GST[c.region]||'27AAQCA4417M1Z6'}<br>${esc(t.id)}</div></div>
    <div class="sec">Customer</div><div><b style="font-weight:600">${esc(c.name)}</b><br>${esc(s.addr)}, ${esc(s.city)}${gstin?`<br>GSTIN ${gstin}`:''}</div>
    <div class="sec">Equipment</div><div>${esc(a.model)}, SN ${a.id}, ${esc(a.site)}<br>Cover: ${esc(b.cv.label)}</div>
    <div class="sec">Problem and fix</div><div>${esc(t.title)}. <b style="font-weight:600">Cause:</b> ${esc(w.cause)}. ${esc(w.note)}</div>
    <div class="sec">Readings on arrival</div><table>${rset(a).map(([k,l,u,lo,hi])=>`<tr><td>${l}</td><td class="r" style="${+w.rd[k]<lo||+w.rd[k]>hi?'color:#C2353D':''}">${esc(w.rd[k])} ${u}</td></tr>`).join('')}</table>
    <div class="sec">Charges</div><table><tr><th>Item</th><th>HSN/SAC</th><th class="r">Qty</th><th class="r">Amount</th></tr>
      ${b.lines.map(l=>`<tr><td>${esc(l.d)}</td><td>${l.sac}</td><td class="r">${l.q}</td><td class="r">${l.cov?`<s>₹${(l.q*l.rate).toLocaleString('en-IN')}</s><br><span style="color:#0F7A4C">Covered</span>`:'₹'+(l.q*l.rate).toLocaleString('en-IN')}</td></tr>`).join('')}
      <tr><td colspan="3">Taxable value</td><td class="r">₹${b.sub.toLocaleString('en-IN')}</td></tr>
      ${intra?`<tr><td colspan="3">CGST 9%</td><td class="r">₹${half.toLocaleString('en-IN')}</td></tr><tr><td colspan="3">SGST 9%</td><td class="r">₹${(b.gst-half).toLocaleString('en-IN')}</td></tr>`:`<tr><td colspan="3">IGST 18%</td><td class="r">₹${b.gst.toLocaleString('en-IN')}</td></tr>`}
      <tr><td colspan="3"><b style="font-weight:600">Total</b></td><td class="r"><b style="font-weight:600">₹${b.total.toLocaleString('en-IN')}</b></td></tr></table>
    <div class="sec">Sign off</div><div class="m-row" style="align-items:flex-end"><div class="g">${esc(w.cname)}, ${esc(c.role)}<br>OTP verified, rated ${w.rating} of 5<br>Engineer: ${esc(mTech().name)}, ${empId(mTech())}<br>${w.photos.length} photos attached</div><svg viewBox="0 0 340 170" style="width:110px;height:55px"><path d="${w.sig}" stroke="#0A2350" stroke-width="3" fill="none" stroke-linecap="round"/></svg></div></div>
  <div class="m-h">Payment</div>${pay}`; };
function payBox(t,w,b,c){ const p=w.pay||{}; const corp=c.seg!=='Residential';
  if (p.st==='paid') return `<div class="m-card" style="background:#E3F6EC;box-shadow:none"><div class="m-row" style="gap:10px;color:#0F7A4C">${ic('checkCircle')}<div class="g" style="font-size:14px">${esc(p.msg)}</div></div></div>`;
  if (p.mode==='upi') return `<div class="m-card" style="text-align:center"><div class="m-t1">Scan to pay ₹${b.total.toLocaleString('en-IN')}</div><div class="m-t3" style="margin-bottom:12px">Any UPI app. astonomiq.svc@hdfcbank</div><div style="width:190px;margin:0 auto;padding:10px;border:1px solid #E6EBF2;border-radius:14px">${fakeQR(t.id+'upi')}</div><div class="m-row" style="justify-content:center;gap:10px;margin-top:14px;color:#40506A"><span class="m-spin"></span>Waiting for payment</div><button class="m-link" style="color:#0A6CF0;margin-top:10px" data-act="maPayMode" data-v="">Choose another way</button></div>`;
  if (p.mode==='link') return `<div class="m-card"><div class="m-row" style="gap:10px"><span class="m-spin"></span><div class="g"><div class="m-t1" style="font-size:14.5px">Payment link sent on WhatsApp</div><div class="m-t3">To ${esc(c.phone)}. Valid for 24 hours.</div></div></div><button class="m-link" style="color:#0A6CF0;margin-top:10px" data-act="maPayMode" data-v="">Choose another way</button></div>`;
  if (p.mode==='cash') return `<div class="m-card"><label class="m-field"><span>Cash received (₹)</span><input class="m-input" id="maCash" inputmode="numeric" value="${esc(p.cash||'')}" placeholder="${b.total}"></label><div class="m-btns"><button class="m-btn white sm" data-act="maPayMode" data-v="">Back</button><button class="m-btn sm" data-act="maCashOk" ${+(p.cash||0)>=b.total?'':'disabled'}>Confirm cash</button></div>${p.cash&&+p.cash<b.total?`<div style="color:#D9434B;font-size:12.5px;margin-top:8px">Less than the bill of ₹${b.total.toLocaleString('en-IN')}.</div>`:''}</div>`;
  return `<div class="m-card"><div class="m-row" style="justify-content:space-between;margin-bottom:12px"><div class="m-t1">Amount due</div><b style="font-size:22px;font-weight:500">₹${b.total.toLocaleString('en-IN')}</b></div><div class="m-pay">
    <button class="m-btn navy sm" data-act="maPayMode" data-v="upi">${ic('scan')}UPI QR</button><button class="m-btn white sm" data-act="maPayMode" data-v="link">${ic('send')}Pay link</button>
    <button class="m-btn white sm" data-act="maPayMode" data-v="cash">${ic('coins')}Cash</button>${corp?`<button class="m-btn white sm" data-act="maPayMode" data-v="credit">${ic('file')}Monthly bill</button>`:''}</div>
    ${corp?`<div class="m-t3" style="margin-top:10px">${esc(c.name.split(',')[0])} is on 30 day credit. Monthly bill adds this to the next invoice.</div>`:''}</div>`; }
ACTIONS.maPayMode = d => { const id=MA.stack[MA.stack.length-1].id, w=work(id), t=getTicket(id), c=getCust(t.cust), b=bill(t);
  if (d.v==='credit'){ w.pay={mode:'credit', st:'paid', msg:`₹${b.total.toLocaleString('en-IN')} added to the October invoice for ${c.name.split(',')[0]}. Payment due in 30 days.`}; renderMA(); return; }
  w.pay = d.v ? {mode:d.v, st:'wait', since:Date.now()} : null; renderMA();
  if (d.v==='upi' || d.v==='link'){ const tok=w.pay; setTimeout(()=>{ if (w.pay!==tok) return; const r=seeded(id+'utr'); const utr=String(Math.floor(r()*9e11+1e11));
    w.pay={mode:d.v, st:'paid', utr, msg:`₹${b.total.toLocaleString('en-IN')} received from ${c.contact} by UPI. UTR ${utr}.`}; if (typeof tone==='function'){ tone(880,0,.12,.05); tone(1320,.13,.18,.05); }
    MA.banner={t:'Payment received', b:`₹${b.total.toLocaleString('en-IN')} by UPI, UTR ${utr}`, ic:'coins'}; renderMA(); hideBanner(); }, d.v==='upi'?5200:7000); } };
ACTIONS.maCashOk = () => { const id=MA.stack[MA.stack.length-1].id, w=work(id), b=bill(getTicket(id)); const r=seeded(id+'rc');
  w.pay={mode:'cash', st:'paid', msg:`₹${(+w.pay.cash).toLocaleString('en-IN')} cash received. Receipt CR-${Math.floor(r()*90000+10000)} sent on WhatsApp.${+w.pay.cash>b.total?` Return ₹${(+w.pay.cash-b.total).toLocaleString('en-IN')} as change.`:''}`}; renderMA(); };

/* ---------- Close the job ---------- */
ACTIONS.maFinish = d => { const t=getTicket(d.id), w=work(t.id), b=bill(t), c=getCust(t.cust); const mins=Math.round((Date.now()-w.t0)/MIN);
  t.st='Resolved'; t.resolvedAt=Date.now(); t.resolution=`${w.cause}. ${w.note}`; t.csat=w.rating;
  (t.parts||[]).forEach(p=>{ if(p.state==='Reserved') p.state='Used'; });
  w.used.forEach(u=>{ t.parts=t.parts||[]; if (getPart(u.sku)) t.parts.push({sku:u.sku, qty:u.q, state:'Used'}); });
  if (w.used.length) techEvent(t,{ic:'package',what:'Parts used from van',text:w.used.map(u=>`${u.q} × ${vanFind(u.sku).name}${u.rma?`, old part on ${u.rma}`:''}`).join(', ')}, `Parts used on ${t.id}`);
  techEvent(t,{ic:'file',what:'Service report signed by customer',text:`${w.cname}, OTP verified, ${w.photos.length} photos attached.`});
  if (b.total) techEvent(t,{ic:'coins',c:'green',what:w.pay.mode==='credit'?'Charges added to monthly bill':'Payment collected on site',text:w.pay.msg}, `₹${b.total.toLocaleString('en-IN')} ${w.pay.mode==='credit'?'billed':'collected'} on ${t.id}`);
  techEvent(t,{ic:'checkCircle',c:'green',what:'Job closed from the field app',text:`${w.cause}. Rated ${w.rating} of 5 by the customer.`}, `Closed ${t.id}, rated ${w.rating} of 5, ${dur(mins)} on site`);
  MA.done={id:t.id, mins, total:b.total, rating:w.rating, parts:w.used.reduce((s,u)=>s+u.q,0), photos:w.photos.length, sla:t.resolvedAt<=t.due};
  delete MA.work[t.id]; MA.stack=[MA.stack[0],{s:'workDone'}]; MA.anim='m-fade'; renderMA(); if (typeof tone==='function'){ tone(660,0,.1,.05); tone(990,.1,.2,.05); }
};

function attMonth(off){ const now=new Date(); const y=now.getFullYear(), mo=now.getMonth()+off; const first=new Date(y,mo,1), days=new Date(y,mo+1,0).getDate(); const r=seeded(MA.tech+mo);
  const out=[]; for(let d=1; d<=days; d++){ const dt=new Date(y,mo,d); const ts=dt.getTime(); const dow=dt.getDay(); let k='p', inn=null, outt=null;
    const lv=MA.leaves.find(l=>l.st!=='Rejected' && ts>=new Date(l.from).setHours(0,0,0,0) && ts<new Date(l.from).setHours(0,0,0,0)+l.days*DAY);
    const hol=(dt.getMonth()===8&&d===14)||(dt.getMonth()===9&&d===2);
    if (dt > now && dt.toDateString()!==now.toDateString()) k = lv?'l':hol?'hd':(dow===0?'o':'f');
    else if (lv) k='l';
    else if (dow===0) k = (mo===now.getMonth()-1 && d===6)?'co':'o';
    else if ((dt.getMonth()===8&&d===14)||(dt.getMonth()===9&&d===2)) k='hd';
    else if (mo===now.getMonth()-1 && d===25) k='x';
    if (k==='p'||k==='co'||k==='x'){ inn=8.4+r()*0.7; outt=18.5+r()*1.6; if (dt.toDateString()===now.toDateString()){ inn=MA.shift?new Date(MA.shift.start).getHours()+new Date(MA.shift.start).getMinutes()/60:null; outt=null; } if (k==='x') outt=null; }
    out.push({d, ts, dow, k, inn, outt}); }
  return {first, days, list:out, name:`${['January','February','March','April','May','June','July','August','September','October','November','December'][first.getMonth()]} ${first.getFullYear()}`}; }

ACTIONS.maChat = () => { seedTech(); MA.chatUnread=0; push('chat'); };
MV.chat = () => { const m=mgr(); const nj=nextJob(); const quick=['Running 15 min late','Need a part urgently','Customer not available','Reached site', nj?`Share ${nj.t.id}`:null].filter(Boolean);
  let last=''; const msgs=MA.chat.map(x=>{ const day=new Date(x.at).toDateString(); const sep=day!==last?`<div class="m-day">${day===new Date().toDateString()?'Today':fD(x.at)}</div>`:''; last=day;

  return {tabs:false, html:`<div style="display:flex;flex-direction:column;height:100%">${navBar({back:'Back', title:esc(m[0]), sub:MA.offline?'Waiting for network':`${esc(m[1])}, online`, right:`<button class="m-back" data-act="maCallDesk">${ic('phone')}</button>`})}
    <div class="m-view" id="maChatV"><div class="m-chat">${msgs}${MA.typing?'<div class="m-typing"><i></i><i></i><i></i></div>':''}</div></div>
    <div class="m-chips" style="padding-top:8px;background:#F3F5F9">${quick.map(q=>`<button data-act="maQuick" data-v="${esc(q)}">${esc(q)}</button>`).join('')}</div>
    <div class="m-composer"><button class="att" data-act="maShareJob" aria-label="Share job">${ic('ticket')}</button><input id="maChatIn" placeholder="Message" value="${esc(MA.chatDraft||'')}"><button class="snd" data-act="maChatSend" aria-label="Send">${ic('send')}</button></div></div>`}; };
MA_AFTER.push(el => { const v=$('#maChatV',el); if (v){ v.scrollTop=v.scrollHeight; MA.chat.forEach(x=>{ if (x.nw) setTimeout(()=>{ x.nw=false; },400); }); } });
function chatSend(txt, tk){ if (!txt.trim() && !tk) return; MA.chat.push({in:false, at:Date.now(), txt:txt.trim(), tk, q:MA.offline, nw:true}); MA.chatDraft=''; renderMA();
  if (MA.offline) return;
  feed(`Chat from ${mTech().name}: ${tk?tk+', ':''}${txt.trim()}`, tk, 'chat');
  const low=txt.toLowerCase(), nj=nextJob(), c=nj?getCust(nj.t.cust):null; let rep;
  if (/part|spare|module|board|fan/.test(low)) rep='Checked with Bhiwandi. It goes with the 2 pm runner. I will share the AWB in the app.';
  else if (/late|traffic|delay/.test(low)) rep=c?`Noted. I have told ${c.contact} you will be 15 to 20 minutes late.`:'Noted, I will inform the customer.';
  else if (/not available|no one|locked/.test(low)) rep='Wait 15 minutes. I am calling the site. If no reply, move to the next job and I will reschedule.';
  else if (/reached/.test(low)) rep='Great, thanks. Update the checklist as you go.';
  else if (tk) rep=`Got it. I am watching ${tk}. Call me if you need anything.`;
  else if (/leave|off/.test(low)) rep='Please apply in the app. I will approve it today.';
  else rep='Okay, noted.';
  setTimeout(()=>{ MA.typing=true; renderMA(); }, 900);
  setTimeout(()=>{ MA.typing=false; MA.chat.push({in:true, who:mgr()[0], at:Date.now(), txt:rep, nw:true}); if (MA.stack[MA.stack.length-1].s!=='chat'){ MA.chatUnread++; MA.banner={t:mgr()[0], b:rep, ic:'chat'}; hideBanner(); } renderMA(); if (typeof tone==='function') tone(1046,0,.08,.04); }, 2800); }

ACTIONS.maQuick = d => { if (/^Share /.test(d.v)){ const nj=nextJob(); chatSend('Sharing this job.', nj.t.id); } else chatSend(d.v); };
ACTIONS.maShareJob = () => { const nj=nextJob(); if (nj) chatSend('Please check this job.', nj.t.id); };
document.addEventListener('keydown', e => { if (e.target.id==='maChatIn' && e.key==='Enter'){ e.preventDefault(); chatSend(e.target.value); } });
document.addEventListener('input', e => { const id=e.target.id; const pos=e.target.selectionStart;

});

/* ---------- Switching technician resets chunk 3 data ---------- */
const _tech = ACTIONS.maTech;
ACTIONS.maTech = d => { MA.exp=null; MA.leaves=null; MA.chat=null; MA.queue=[]; MA.offline=false; MA.done=null; MA.regDone=false; _tech(d); };

/* Actions that message the customer wait for network */
['maStartTravel','maWaSend','maCheckIn'].forEach(k => { const f=ACTIONS[k]; if (!f) return; ACTIONS[k] = d => { const off=MA.offline; f(d); if (off && MA.banner && /WhatsApp|notified|message/i.test(MA.banner.t+' '+MA.banner.b)){ MA.banner={t:'Saved on the phone', b:'The customer message goes out as soon as the network is back.', ic:'wifi'}; renderMA(); hideBanner(); } }; });

/* @@MORE_MODULES@@ */
/* ===== boot ===== */
(function boot(){
  $('#menuBtn').innerHTML = ic('menu');
  $('#sIco').outerHTML = ic('search');
  $('#bIco').outerHTML = ic('bell');
  $('#ntBtn').innerHTML = ic('plus') + 'New ticket';
  $('#uChev').innerHTML = ic('chevD','sm');
  $('#uiHome').outerHTML = ic('dashboard','sm');
  $('#uiOut').outerHTML = ic('logout','sm');
  wire();
})();
